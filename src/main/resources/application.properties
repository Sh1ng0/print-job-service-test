spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:printservice}
spring.datasource.username=${DB_USER:printservice}
spring.datasource.password=${DB_PASSWORD:printservice}

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.threads.virtual.enabled=true
