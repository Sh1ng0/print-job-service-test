services:
  postgres:
    image: postgres:16-alpine
    container_name: printservice-db
    environment:
      POSTGRES_DB: print_service_db
      POSTGRES_USER: print_user
      POSTGRES_PASSWORD: print_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U print_user -d print_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: printservice-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=print_service_db
      - DB_USER=print_user
      - DB_PASSWORD=print_password
    depends_on:
      postgres:
        condition: service_healthy